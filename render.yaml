services:
  # ==================== Backend ====================
  - type: web
    name: sahal-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install fastapi uvicorn motor pymongo[srv] pyjwt bcrypt httpx python-dotenv pydantic python-multipart
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: sahal_db
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://sahal-frontend.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: STRIPE_API_KEY
        sync: false
      - key: PORT
        value: "10000"

  # ==================== Frontend ====================
  - type: web
    name: sahal-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npx serve -s build -l $PORT
    plan: free
    envVars:
      - key: REACT_APP_BACKEND_URL
        value: https://sahal-backend.onrender.com
      - key: REACT_APP_GOOGLE_CLIENT_ID
        sync: false
      - key: NODE_VERSION
        value: "18"
